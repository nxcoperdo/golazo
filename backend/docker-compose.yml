# Golazo en el VPS: API + PostgreSQL/PostGIS. Nginx (TLS) va por delante y
# reenvía a 127.0.0.1:3000. Copia .env.example a .env y cambia los secretos.
services:
  db:
    image: postgis/postgis:16-3.4
    restart: unless-stopped
    environment:
      POSTGRES_USER: golazo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?define POSTGRES_PASSWORD en .env}
      POSTGRES_DB: golazo
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U golazo -d golazo"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://golazo:${POSTGRES_PASSWORD}@db:5432/golazo
      JWT_SECRET: ${JWT_SECRET:?define JWT_SECRET en .env}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      PORT: "3000"
    ports:
      # Solo local: el acceso público pasa por Nginx.
      - "127.0.0.1:3000:3000"

  # Aplica las migraciones pendientes: docker compose run --rm migrate
  migrate:
    build: .
    profiles: ["tools"]
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://golazo:${POSTGRES_PASSWORD}@db:5432/golazo
    command: ["node", "dist/db/migrate.js"]

volumes:
  pgdata:
