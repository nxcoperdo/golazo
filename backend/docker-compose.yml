# Golazo en el VPS: API + PostgreSQL/PostGIS. Nginx (TLS) va por delante y
# reenvía a 127.0.0.1:3000. Copia .env.example a .env y cambia los secretos.
services:
  db:
    image: postgis/postgis:16-3.4
    restart: unless-stopped
    environment:
      POSTGRES_USER: golazo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?define POSTGRES_PASSWORD en .env}
      POSTGRES_DB: golazo
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U golazo -d golazo"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://golazo:${POSTGRES_PASSWORD}@db:5432/golazo
      JWT_SECRET: ${JWT_SECRET:?define JWT_SECRET en .env}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      PORT: "3000"
      STORAGE_DIR: /app/storage
      SMTP_URL: ${SMTP_URL:-}
      MAIL_FROM: ${MAIL_FROM:-Golazo <no-reply@golazo.local>}
      APP_RESET_URL: ${APP_RESET_URL:-golazo://reset-password}
      SUBSCRIPTION_PRICE: ${SUBSCRIPTION_PRICE:-100000}
      UNPAID_MINUTES: ${UNPAID_MINUTES:-30}
      PLATFORM_PAYMENT_ACCOUNTS: ${PLATFORM_PAYMENT_ACCOUNTS:-}
      REQUIRE_EMAIL_VERIFICATION: ${REQUIRE_EMAIL_VERIFICATION:-0}
      APP_VERIFY_URL: ${APP_VERIFY_URL:-golazo://verify-email}
      # Push FCM (opcional): monta la cuenta de servicio y apunta a ella.
      FCM_SERVICE_ACCOUNT_FILE: ${FCM_SERVICE_ACCOUNT_FILE:-}
      # Datos del responsable que salen en /legal/* (términos, privacidad, soporte).
      LEGAL_RESPONSIBLE_NAME: ${LEGAL_RESPONSIBLE_NAME:-}
      LEGAL_RESPONSIBLE_ID: ${LEGAL_RESPONSIBLE_ID:-}
      LEGAL_CONTACT_EMAIL: ${LEGAL_CONTACT_EMAIL:-}
      LEGAL_PHONE: ${LEGAL_PHONE:-}
      LEGAL_ADDRESS: ${LEGAL_ADDRESS:-}
      LEGAL_CITY: ${LEGAL_CITY:-}
    volumes:
      # Fotos de canchas y comprobantes. Incluir en los respaldos del VPS.
      - uploads:/app/storage
      # Push FCM: descomenta (el archivo debe existir) y pon FCM_SERVICE_ACCOUNT_FILE=/run/secrets/fcm.json
      - ./secrets/fcm.json:/run/secrets/fcm.json:ro
    ports:
      # Solo local (el acceso público pasa por el proxy). Si el 3000 está ocupado: API_HOST_PORT=3010 en .env.
      - "127.0.0.1:${API_HOST_PORT:-3000}:3000"

  # HTTPS público (solo en el servidor): docker compose --profile prod up -d
  # Necesita DOMAIN en .env apuntando a la IP del servidor y los puertos 80 y 443 abiertos.
  caddy:
    image: caddy:2-alpine
    profiles: ["prod"]
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

  # Aplica las migraciones pendientes: docker compose run --rm migrate
  migrate:
    build: .
    profiles: ["tools"]
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://golazo:${POSTGRES_PASSWORD}@db:5432/golazo
    command: ["node", "dist/db/migrate.js"]

volumes:
  pgdata:
  uploads:
  caddy_data:
  caddy_config:
